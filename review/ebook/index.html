<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Review the Local Hub ebook</title>
  <link rel="stylesheet" href="/review/style.css">
  <script src="./review.js" defer></script>
</head>
<body>
  <main class="card" style="max-width: 520px">
    <div class="brand-logo">Local Hub</div>
    <h1>How helpful was our ebook?</h1>
    <p class="sub">Share your feedback on <em>How to Prevent Costly Water Damage at Home</em>.</p>
    <form id="ebook-review" method="post">
      <label for="rating">Helpfulness</label>
      <select id="rating" name="rating" required style="width: 100%; padding: 12px; margin-bottom: 16px; font: inherit; border: 1px solid #d0d7de; border-radius: 8px; background: #fff; color: inherit">
        <option value="" disabled selected>Select a rating</option>
        <option value="5">5 · Extremely helpful</option>
        <option value="4">4 · Very helpful</option>
        <option value="3">3 · Moderately helpful</option>
        <option value="2">2 · Slightly helpful</option>
        <option value="1">1 · Not helpful</option>
      </select>
      <label for="feedback">What helped, or what could we improve? <span>(optional)</span></label>
      <textarea id="feedback" name="feedback" rows="3" maxlength="1500"></textarea>
      <label for="email">Email you used to get the ebook</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <p class="small">Your feedback goes directly to the Local Hub team.</p>
      <button class="submit negative" type="submit" id="submit" disabled>Send feedback</button>
      <noscript><p class="small">Enable JavaScript to send feedback.</p></noscript>
    </form>
    <p id="status" role="status" aria-live="polite"></p>
    <footer><a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></footer>
  </main>
</body>
</html>
